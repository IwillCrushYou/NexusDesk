version: '3.8'

services:
  api:
    build: .
    ports:
      - '4000:4000'
    environment:
      - DATABASE_URL=postgresql://nexusdesk_app:localpassword@db:5432/nexusdesk
      - JWT_SECRET=local_dev_secret_only
      - PORT=4000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npm start"

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=nexusdesk_app
      - POSTGRES_PASSWORD=localpassword
      - POSTGRES_DB=nexusdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusdesk_app -d nexusdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
