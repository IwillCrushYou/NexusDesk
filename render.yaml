services:
  - type: web
    name: nexusdesk-api
    env: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexusdesk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: nexusdesk-db
    databaseName: nexusdesk
    user: nexusdesk_app
    plan: free
